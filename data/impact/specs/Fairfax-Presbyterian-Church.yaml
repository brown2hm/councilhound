extraction_quotes:
  existing.sqft: existing 43,000 square foot church with day care and parking
  existing.units: The Property is currently used as a Religious Institution with an
    accessory Day Care Center.
  proposed.units: the Property may be developed with up to ten (10) townhouses
  proposed.stories: All ten units will have three levels, three bedrooms, two bathrooms
  proposed.acres: Parcel 57-1-02-122-A (3.02 acres), and Parcel 57-1-02-123 (5.23
    acres), for a total of 8.25 acres
  proposed.affordable_units: ten new affordable residential townhouses in the northeast
    corner of the Property
  proposed.tenure: eight for sale units that would be owner-occupied and two rental
    units
extraction_notes:
- 'external_estimates: staff estimate transcribed by hand at the confirm gate (2026-08-22).
  The October 24, 2022 PC Public Hearing staff report states it at char ~144k of the
  extracted text, beyond the extraction pass''s 60,000-char per-document budget, so
  the LLM never saw the sentence; the quote is verbatim from the document.'
- 'Proposed parking spaces: April 19, 2022 Narrative (Doc 22) and October 27, 2021
  Narrative (Doc 27) and March 2, 2021 Statement of Justification (Doc 30) state 38
  parking spaces in the southwest corner; July 26, 2022 Narrative (Doc 16) and all
  later narratives (Aug 24, Sep 30, Oct 25 2022) and Summary of Commitments (Docs
  6 & 11) state up to 30 parking spaces. The most recent authoritative documents (October
  25, 2022 Summary of Commitments) use 30.'
- 'Open space percentage: July 26, 2022 Narrative (Doc 16) and April 19, 2022 Narrative
  (Doc 22) state approximately 54% of site area as open space; later narratives (Aug
  24, Sep 30, Oct 25 2022) revised this to approximately 32% of site area.'
- 'Tree canopy coverage: July 26, 2022 Narrative (Doc 16) and earlier narratives state
  40% of site area; later narratives (Aug 24, Sep 30, Oct 25 2022) revised to approximately
  36.5% of site area.'
- 'Tree-save area: July 26, 2022 Narrative (Doc 16) and earlier narratives state approximately
  133,400 square feet; later narratives (Aug 24, Sep 30, Oct 25 2022) revised to approximately
  116,100 square feet.'
- March 2021 Statement of Justification (Doc 30) Item B.1 describes all units as owner-occupied
  with no rental units; later narratives from Oct 2021 onward describe 8 for-sale/owner-occupied
  units and 2 rental units (sold to Homestretch).
- 'proposed.parking_spaces: demoted to null (quote longer than 15 words; model claimed
  30)'
