    Diocese
  proposed.units: includes a total of 266 residential units, including 144 multifamily
    residential condominiums
  proposed.retail_sqft: Commercial/Retail Space 20,000 square feet
  proposed.stories: The multi-family condominium building shall be four (4) stories.
  proposed.acres: consolidation of three parcels for a total of 18.51 acres
extraction_notes:
- 'proposed.tenure: set to for_sale by hand at the confirm gate. The documents establish
  it by negation — the commitment "No rental units shall be developed or offered."
  (verbatim in the corpus) plus a program of 144 condominiums, 115 townhomes, and 7
  single-family homes — but the evidence-token firewall cannot accept a negated quote
  (it reads the word "rental" as rental-class evidence), so the LLM extraction was
  correctly rejected and a human transcription is used instead (2026-08-22).'
- 'Proposed residential unit count changed across plan versions: the approved/final
  project directory (Doc 1) states 266 total units (144 condominiums + 115 townhomes
  + 7 single-family); the August 2018 Narrative (Doc 3) also states 266 units; but
  the May 2018 Statement of Support (Doc 5) shows 295 units (131 townhomes + 164 condominiums);
  the March 2018 Narrative (Doc 13) shows 301 units (137 townhomes + 164 condominiums);
  the November 2017/February 2018 submissions (Docs 19, 23) show 321 units (137 townhomes
  + 184 condominiums); and the April 2017 submission (Doc 31) shows 555 units. The
  most authoritative and recent approved figure is 266 units per Doc 1.'
- 'Proposed condominium building height conflicts: August 2018 Narrative (Doc 3) states
  ''The multi-family condominium building shall be four (4) stories)''; earlier submissions
  (Docs 19, 23, 31) describe a 5-story condominium building; the city project directory
  does not specify stories.'
- Retail square footage is consistently stated at 20,000 SF in the later/approved
  submissions (Docs 1, 3, 5, 13), but the April 2017 submission (Doc 31) shows only
  10,000 SF of retail.
- 'Total commercial+community space: all versions consistently include 24,000 SF for
  the preserved school building in addition to the retail, making total commercial/community
  SF either 44,000 (later versions) or 34,000 (April 2017 version).'
- 'Parking spaces provided: Feb 2018 Statement of Support (Doc 19) states 987 provided
  spaces; the April 2017 submission (Doc 31) states 1,130 spaces. The approved plan
  parking total is not explicitly stated in Doc 1.'
- 'Single-family detached homes: Doc 1 and Doc 3 (August 2018) include 7 single-family
  homes in the 266-unit total; earlier versions (Docs 5, 13, 19, 23) did not include
  single-family detached units.'
- parcel PIN '57-1-02-114' not found in documents — dropped
- parcel PIN '57-1-02-113' not found in documents — dropped
- parcels resolved via address_geocode; polygon area 0.11 ac
- 'WARNING: resolved parcel area 0.11 ac differs from stated 18.51 ac by 99%'
- 'parcels set by hand: the 18.51-ac former Paul VI school site has been re-subdivided
  into block 57 1 39 (269 lots/units, union 18.52 ac); the geocode had landed on a
  single 0.11-ac lot of the redevelopment. NOTE: current assessed values reflect the
  built/under-construction project, not the pre-development baseline; the real-estate-tax-increase
  metric understates the true increment'
- 'geometry re-resolved at confirm from edited parcels via document_pins: 285.30 ac'
