extraction_notes:
- 'external_estimates: staff estimate transcribed by hand at the confirm gate
  (2026-08-22). The June 23, 2025 PC Public Hearing staff report states it at char
  ~108k of the extracted text, beyond the extraction pass''s 60,000-char per-document
  budget, so the LLM never saw the sentence; the quote is verbatim from the document.'
- 'Retail sq ft: City project directory (Doc 1) and Transportation Impact Studies
  (Docs 7, 11, 14) state 6,608 sq ft of retail use and 4,188 sq ft of office use separately
  (total ~10,796 sq ft nonresidential); the July 3, 2025 Statement of Support (Doc
  2) and proffers (Doc 4) describe ''approximately 10,796 square feet of retail, office
  or other commercial nonresidential uses'' as a combined figure. The GDP plan sheets
  (Docs 3, 6) show RETAIL=6,608 GSF, CO-WORK=2,653 GSF, and BUSINESS CENTER=1,535
  GSF as distinct labeled spaces.'
- 'Parking spaces: City project directory (Doc 1) states ''424 spaces in structured
  parking''; the July 3, 2025 Statement of Support (Doc 2), May 2025 Statement of
  Support (Doc 5), and April 2025 Statement of Support (Doc 9) all state ''approximately
  423 shared parking spaces''. The most recent applicant documents (Docs 2, 4, 5)
  consistently use 423.'
- 'Building height (Building B): The April 2025 GDP (Doc 10) labels Building B as
  ''5 STORIES / 46'' - 9"'', while the July 2025 and May 2025 GDP (Docs 3 and 6) label
  Building B as ''5 STORIES / 58'' - 1"'', indicating the height was revised upward
  between the April and May 2025 resubmissions.'
- 'Office sq ft characterization: The July 2025 Statement of Support (Doc 2) and proffers
  (Doc 4) describe the nonresidential space as ''retail, office or other commercial
  nonresidential uses'' without separately stating office sq ft; the Transportation
  Impact Studies (Docs 7, 11, 14) explicitly state ''4,188 square feet of office use''
  as a discrete component. The GDP shows CO-WORK (2,653 GSF) + BUSINESS CENTER (1,535
  GSF) = 4,188 GSF, which aligns with the TIS figure.'
- 'proposed.stories: demoted to null (quote longer than 15 words; model claimed 5)'
- 'proposed.affordable_units: demoted to null (quote longer than 15 words; model claimed
  17)'
- parcels resolved via address_geocode; polygon area 2.70 ac
