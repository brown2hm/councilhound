  map_zoom: {compact: 15, full: 14}
  map_bounds: [[38.83, -77.33], [38.87, -77.27]]
  nearby_radii_m: [805, 1609, 3219]
  example_address: 10455 Armstrong St
  address_strip_regex: ", Fairfax"
  ask_suggestions:
