[pytest]
# Put the ingestion root on sys.path so tests can import each other's helpers
# (tests/impact/test_adjust_terms.py does
# `from tests.impact.test_capture_invariants import _dest, _spend`).
#
# This was passing locally and failing in CI for a reason worth recording:
# `python -m pytest` implicitly prepends the working directory to sys.path,
# while the bare `pytest` console script does not. CI runs `uv run pytest`, so
# the import resolved for anyone testing with `python -m` and broke on the
# runner. Setting it here makes every invocation style agree.
pythonpath = .
